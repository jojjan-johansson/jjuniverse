<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Betalning avbruten — JJ Universe</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="stylesheet" href="/static/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Text:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <style>
    body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 16px; }
    .box {
      background:linear-gradient(160deg,#1a0048,#0d0020);
      border:1px solid rgba(155,48,255,0.2);
      border-radius:20px; padding:48px 40px;
      max-width:440px; width:100%;
      text-align:center;
    }
    h1 { font-family:'Cinzel',serif; font-size:1.2rem; color:#fff; letter-spacing:0.1em; margin-bottom:16px; }
    p { font-family:'Crimson Text',serif; color:#9980bb; font-size:0.95rem; line-height:1.6; margin-bottom:24px; }
    .btn {
      display:inline-block;
      background:linear-gradient(135deg,#5b00a8,#9b30ff);
      color:#fff; text-decoration:none;
      border-radius:10px; padding:12px 28px;
      font-family:'Cinzel',serif; font-size:0.85rem; letter-spacing:0.08em;
    }
  </style>
</head>
<body>
<canvas id="stars-canvas"></canvas>
<div class="box">
  <h1>Betalning avbruten</h1>
  <p>Ingen betalning har genomförts. Du kan försöka igen när du känner dig redo.</p>
  <a href="/kop" class="btn">Tillbaka till paketen ✦</a>
</div>
<script src="/static/js/app.js"></script>
</body>
</html>
